events {}
http {
  # Gateway do Supabase de TESTE (no Supabase real, o Kong faz este papel)
  map $http_origin $cors_origin { default $http_origin; "" "*"; }
  server {
    listen 8000;
    client_max_body_size 10m;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type, content-profile, accept-profile, prefer, range, x-supabase-api-version, x-upsert" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Expose-Headers "content-range, x-supabase-api-version" always;
    if ($request_method = OPTIONS) { return 204; }
    location /templates/ { alias /usr/share/nginx/templates/; }
    location /auth/v1/ { proxy_pass http://auth:9999/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto http; }
    location /rest/v1/ { proxy_pass http://rest:3000/; proxy_set_header Host $host; }
  }
}
