# Supabase mínimo para TESTES locais (Postgres + Auth + REST + e-mail falso).
# Uso: npm run test:stack:up  (ver README). Não use em produção.
name: yl-supabase-test
services:
  db:
    image: supabase/postgres:15.8.1.060
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c log_min_messages=fatal
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports: ["54322:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 5s
      retries: 40
  auth:
    image: supabase/gotrue:v2.170.0
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: nao-responda@yl.test
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: x
      GOTRUE_SMTP_PASS: x
      GOTRUE_SMTP_SENDER_NAME: YL Empregabilidade
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway:8000/templates/confirmacao.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://gateway:8000/templates/recuperacao.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://gateway:8000/templates/troca-email.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://gateway:8000/templates/magic-link.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://gateway:8000/templates/convite.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirme seu e-mail · YL Empregabilidade"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Crie uma nova senha · YL Empregabilidade"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Confirme seu novo e-mail · YL Empregabilidade"
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Seu link de acesso · YL Empregabilidade"
      GOTRUE_MAILER_SUBJECTS_INVITE: "Convite · YL Empregabilidade"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_RATE_LIMIT_VERIFY: 1000
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 1000
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
  rest:
    image: postgrest/postgrest:v12.2.8
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
  mail:
    image: axllent/mailpit:v1.21
    ports: ["54324:8025"]
  gateway:
    image: nginx:1.27-alpine
    depends_on: [auth, rest]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../templates:/usr/share/nginx/templates:ro
    ports: ["54321:8000"]
